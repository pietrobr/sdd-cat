<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <rect width="200" height="200" rx="12" fill="#e9ecef"/>
  <g transform="translate(50, 40)">
    <!-- Cat ears -->
    <polygon points="15,50 0,10 30,30" fill="#adb5bd"/>
    <polygon points="85,50 100,10 70,30" fill="#adb5bd"/>
    <!-- Cat face -->
    <ellipse cx="50" cy="70" rx="45" ry="40" fill="#ced4da"/>
    <!-- Eyes -->
    <ellipse cx="35" cy="60" rx="6" ry="7" fill="#495057"/>
    <ellipse cx="65" cy="60" rx="6" ry="7" fill="#495057"/>
    <!-- Nose -->
    <polygon points="50,72 46,78 54,78" fill="#e91e63"/>
    <!-- Mouth -->
    <path d="M46,78 Q50,84 54,78" stroke="#495057" stroke-width="1.5" fill="none"/>
    <!-- Whiskers -->
    <line x1="10" y1="70" x2="30" y2="68" stroke="#6c757d" stroke-width="1"/>
    <line x1="10" y1="76" x2="30" y2="75" stroke="#6c757d" stroke-width="1"/>
    <line x1="70" y1="68" x2="90" y2="70" stroke="#6c757d" stroke-width="1"/>
    <line x1="70" y1="75" x2="90" y2="76" stroke="#6c757d" stroke-width="1"/>
  </g>
  <text x="100" y="170" text-anchor="middle" fill="#adb5bd" font-family="sans-serif" font-size="14">🐱</text>
</svg>
