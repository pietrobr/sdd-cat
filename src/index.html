<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SDD-Cat — Galleria di Gatti</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <h1>🐱 SDD-Cat</h1>
        <p>La tua galleria di gatti</p>
    </header>

    <main>
        <noscript>
            <div class="noscript-message">
                <p>JavaScript è necessario per visualizzare la galleria di gatti. Per favore, abilita JavaScript nel tuo browser.</p>
            </div>
        </noscript>

        <div id="error-message" class="error-message" hidden>
            <p>🐱 I gatti stanno dormendo, riprova più tardi!</p>
            <button id="retry-btn" class="btn">Riprova</button>
        </div>

        <div id="loading" class="loading" hidden>
            <p>Caricamento gatti...</p>
        </div>

        <div id="gallery" class="gallery"></div>

        <div class="load-more-container">
            <button id="load-more-btn" class="btn" hidden>Mostra altri gatti 🐾</button>
        </div>
    </main>

    <footer class="footer">
        <p>Immagini fornite da <a href="https://thecatapi.com" target="_blank" rel="noopener noreferrer">TheCatAPI</a></p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
